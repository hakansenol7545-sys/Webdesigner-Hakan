<style>
  :root{
    --bg: #F6F7FB;
    --bg-alt: #EDEFF7;
    --panel: #FFFFFF;
    --ink: #10142B;
    --ink-soft: #4B5170;
    --line: #DFE2EE;
    --accent: #2F5CFF;
    --accent-ink: #0E2BB0;
    --mint: #00C48C;
    --code: "JetBrains Mono", monospace;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  h1,h2,h3{
    font-family:'Space Grotesk', 'Inter', sans-serif;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0;
  }

  .wrap{ max-width:1120px; margin:0 auto; padding:0 24px; }
  .eyebrow{
    font-family:var(--code);
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--accent-ink);
    background:rgba(47,92,255,0.08);
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 12px;
    border-radius:100px;
    margin-bottom:18px;
  }
  .eyebrow::before{ content:"●"; color:var(--mint); font-size:8px; }

  /* NAV */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(246,247,251,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:74px;
  }
  .logo{
    font-family:var(--code);
    font-weight:700;
    font-size:16px;
    display:flex; align-items:center; gap:10px;
    text-decoration:none;
    color:var(--ink);
  }
  .logo .dot{ width:9px; height:9px; border-radius:2px; background:var(--accent); display:inline-block; }
  .navlinks{ display:flex; gap:32px; list-style:none; margin:0; padding:0; }
  .navlinks a{
    text-decoration:none; font-size:15px; color:var(--ink-soft); font-weight:500;
    transition:color .2s;
  }
  .navlinks a:hover{ color:var(--accent-ink); }
  .nav-cta{
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px;
    font-size:14px; font-weight:600; text-decoration:none;
  }
  .nav-cta:hover{ background:var(--accent-ink); }
  .burger{ display:none; background:none; border:none; cursor:pointer; }
  .burger span{ display:block; width:24px; height:2px; background:var(--ink); margin:5px 0; }

  /* HERO */
  .hero{ padding:88px 0 70px; }
  .hero-grid{
    display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center;
  }
  .hero h1{ font-size:52px; line-height:1.06; }
  .hero h1 .accentline{ color:var(--accent-ink); }
  .hero p.lead{
    font-size:18px; color:var(--ink-soft); margin-top:22px; max-width:480px; line-height:1.6;
  }
  .hero-actions{ display:flex; gap:14px; margin-top:32px; flex-wrap:wrap; }
  .btn-primary, .btn-secondary{
    padding:14px 24px; border-radius:9px; font-weight:600; font-size:15px;
    text-decoration:none; display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-ink); }
  .btn-secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn-secondary:hover{ border-color:var(--ink); }

  /* Terminal signature element */
  .terminal{
    background:#10142B;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(16,20,43,0.35);
    border:1px solid #262b4a;
  }
  .terminal-bar{
    display:flex; align-items:center; gap:8px;
    padding:12px 16px;
    background:#191F3F;
    border-bottom:1px solid #262b4a;
  }
  .terminal-bar span{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .terminal-bar .r{ background:#FF5F57; }
  .terminal-bar .y{ background:#FEBC2E; }
  .terminal-bar .g{ background:#28C840; }
  .terminal-title{
    margin-left:8px; font-family:var(--code); font-size:12px; color:#8890B5;
  }
  .terminal-body{
    padding:22px 20px 26px;
    font-family:var(--code);
    font-size:13.5px;
    line-height:1.9;
    color:#C9CEEA;
    min-height:260px;
  }
  .terminal-body .prompt{ color:var(--mint); }
  .terminal-body .path{ color:#7C8BFF; }
  .term-line{ opacity:0; animation:fadeIn .4s forwards; }
  .term-out{ color:#8890B5; padding-left:18px; }
  @keyframes fadeIn{ to{ opacity:1; } }
  .cursor{
    display:inline-block; width:7px; height:15px; background:var(--mint);
    vertical-align:middle; animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* trust bar */
  .trust{ padding:26px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--bg-alt); }
  .trust .wrap{ display:flex; flex-wrap:wrap; gap:34px; justify-content:space-between; align-items:center; }
  .trust-item{ font-size:14px; color:var(--ink-soft); display:flex; align-items:center; gap:9px; }
  .trust-item b{ color:var(--ink); font-family:var(--code); font-size:14px; }

  /* SECTION HEADER */
  .sec{ padding:96px 0; }
  .sec-head{ max-width:600px; margin-bottom:52px; }
  .sec-head h2{ font-size:36px; line-height:1.15; }
  .sec-head p{ color:var(--ink-soft); font-size:16px; margin-top:14px; line-height:1.6; }

  /* SERVICES */
  .services-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:20px;
  }
  .service-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:28px 26px; transition:transform .2s, box-shadow .2s, border-color .2s;
  }
  .service-card:hover{
    transform:translateY(-4px);
    box-shadow:0 20px 40px -24px rgba(16,20,43,0.25);
    border-color:#c7cdf0;
  }
  .service-tag{
    font-family:var(--code); font-size:12px; color:var(--accent-ink);
    background:rgba(47,92,255,0.08); padding:4px 10px; border-radius:6px;
    display:inline-block; margin-bottom:16px;
  }
  .service-card h3{ font-size:19px; margin-bottom:10px; }
  .service-card p{ font-size:14.5px; color:var(--ink-soft); line-height:1.6; margin:0; }

  /* PROCESS */
  .process{ background:var(--ink); color:#fff; border-radius:22px; padding:64px 48px; }
  .process .sec-head h2{ color:#fff; }
  .process .sec-head p{ color:#9AA0C6; }
  .process-steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px; margin-top:10px; }
  .step{ border-top:2px solid #2A2F55; padding-top:18px; }
  .step .num{ font-family:var(--code); color:var(--mint); font-size:13px; }
  .step h3{ color:#fff; font-size:17px; margin:10px 0 8px; }
  .step p{ color:#9AA0C6; font-size:14px; line-height:1.55; margin:0; }

  /* WHY / STATS */
  .why-grid{ display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center; }
  .why-list{ list-style:none; margin:24px 0 0; padding:0; display:flex; flex-direction:column; gap:16px; }
  .why-list li{ display:flex; gap:14px; font-size:15.5px; color:var(--ink-soft); line-height:1.6; }
  .why-list li::before{ content:"→"; color:var(--accent-ink); font-weight:700; flex-shrink:0; }
  .stat-card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:30px; }
  .stat-row{ display:flex; justify-content:space-between; align-items:baseline; padding:18px 0; border-bottom:1px solid var(--line); }
  .stat-row:last-child{ border-bottom:none; }
  .stat-num{ font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:700; color:var(--accent-ink); }
  .stat-label{ font-size:13.5px; color:var(--ink-soft); text-align:right; max-width:200px; }

  /* CONTACT */
  .contact-wrap{ display:grid; grid-template-columns:0.85fr 1.15fr; gap:48px; }
  .contact-info h2{ font-size:34px; }
  .contact-info p{ color:var(--ink-soft); margin-top:14px; line-height:1.6; font-size:16px; max-width:400px; }
  .info-line{ display:flex; align-items:center; gap:12px; margin-top:22px; font-size:15px; }
  .info-line span.k{ font-family:var(--code); color:var(--accent-ink); font-size:12px; background:rgba(47,92,255,0.08); padding:4px 8px; border-radius:5px; width:78px; text-align:center; flex-shrink:0; }

  .form-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:34px;
  }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .field{ margin-bottom:18px; display:flex; flex-direction:column; gap:7px; }
  .field label{ font-size:13px; font-weight:600; color:var(--ink); }
  .field input, .field textarea{
    border:1.5px solid var(--line); border-radius:9px; padding:12px 14px; font-family:inherit;
    font-size:14.5px; background:#FCFDFF; color:var(--ink); resize:vertical;
  }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,92,255,0.14);
  }
  .submit-btn{
    background:var(--accent); color:#fff; border:none; padding:14px 26px; border-radius:9px;
    font-weight:600; font-size:15px; cursor:pointer; width:100%;
  }
  .submit-btn:hover{ background:var(--accent-ink); }
  .form-note{ font-size:12.5px; color:var(--ink-soft); margin-top:12px; text-align:center; }

  /* FOOTER */
  footer{ border-top:1px solid var(--line); padding:40px 0; background:var(--bg-alt); }
  .footer-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  .footer-links{ display:flex; gap:22px; list-style:none; padding:0; margin:0; }
  .footer-links a{ font-size:13.5px; color:var(--ink-soft); text-decoration:none; background:none; border:none; cursor:pointer; font-family:inherit; }
  .footer-links a:hover{ color:var(--accent-ink); }
  .footer-small{ font-size:13px; color:var(--ink-soft); font-family:var(--code); }

  /* MODAL */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(16,20,43,0.55);
    z-index:100; align-items:flex-start; justify-content:center; padding:60px 20px; overflow-y:auto;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#fff; border-radius:16px; max-width:640px; width:100%; padding:40px; position:relative;
  }
  .modal h2{ font-size:24px; margin-bottom:18px; }
  .modal h3{ font-size:16px; margin:22px 0 8px; }
  .modal p, .modal li{ font-size:14.5px; color:var(--ink-soft); line-height:1.7; }
  .modal-close{
    position:absolute; top:18px; right:18px; background:var(--bg-alt); border:none;
    width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:16px; color:var(--ink);
  }

  @media (max-width: 880px){
    .navlinks{
      position:fixed; top:74px; left:0; right:0; background:var(--bg);
      flex-direction:column; padding:20px 24px; border-bottom:1px solid var(--line);
      display:none; gap:18px;
    }
    .navlinks.open{ display:flex; }
    .nav-cta{ display:none; }
    .burger{ display:block; }
    .hero-grid{ grid-template-columns:1fr; }
    .hero h1{ font-size:38px; }
    .services-grid{ grid-template-columns:1fr; }
    .process-steps{ grid-template-columns:1fr 1fr; }
    .why-grid{ grid-template-columns:1fr; }
    .contact-wrap{ grid-template-columns:1fr; }
    .form-row{ grid-template-columns:1fr; }
    .process{ padding:44px 24px; }
    .sec{ padding:64px 0; }
    .footer-row{ flex-direction:column; align-items:flex-start; }
  }

  /* RESTAURANT ONLINE-BESTELLUNG */
  .restaurant-section{background:var(--bg-alt);}
  .restaurant-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:24px;align-items:start;}
  .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .food-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .food-card h3{font-size:18px;margin-bottom:7px;}
  .food-card p{font-size:14px;color:var(--ink-soft);line-height:1.5;margin:0 0 15px;}
  .food-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .food-price{font-family:var(--code);font-weight:700;color:var(--accent-ink);}
  .add-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;}
  .add-btn:hover{background:var(--accent-ink);}
  .cart-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;position:sticky;top:94px;}
  .cart-box h3{font-size:21px;margin-bottom:18px;}
  .cart-empty{color:var(--ink-soft);font-size:14px;padding:18px 0;}
  .cart-item{border-bottom:1px solid var(--line);padding:13px 0;}
  .cart-item:last-child{border-bottom:0;}
  .cart-item-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;}
  .cart-controls{display:flex;align-items:center;gap:9px;margin-top:9px;}
  .qty-btn{width:29px;height:29px;border:1px solid var(--line);background:var(--bg);border-radius:7px;cursor:pointer;font-weight:700;}
  .qty-number{min-width:20px;text-align:center;}
  .cart-remove{margin-left:auto;border:0;background:none;color:#b42318;cursor:pointer;font-size:12px;}
  .cart-total{display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding-top:16px;margin-top:8px;font-size:17px;font-weight:700;}
  .checkout-btn{width:100%;margin-top:16px;border:0;background:var(--ink);color:#fff;padding:14px;border-radius:9px;font-weight:700;cursor:pointer;font-size:15px;}
  .checkout-btn:hover{background:var(--accent-ink);}
  .cart-count{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;margin-left:5px;}
  .order-note{font-size:12px;color:var(--ink-soft);line-height:1.5;margin:12px 0 0;text-align:center;}
  @media(max-width:880px){
    .restaurant-grid{grid-template-columns:1fr;}
    .menu-grid{grid-template-columns:1fr;}
    .cart-box{position:static;}
  }


  /* CHECKOUT */
  .checkout-overlay{display:none;position:fixed;inset:0;background:rgba(16,20,43,.6);z-index:200;align-items:center;justify-content:center;padding:20px;overflow:auto;}
  .checkout-overlay.open{display:flex;}
  .checkout-modal{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:30px;position:relative;}
  .checkout-modal h2{font-size:25px;margin-bottom:8px;}
  .checkout-modal .checkout-intro{color:var(--ink-soft);font-size:14px;line-height:1.5;margin:0 0 22px;}
  .checkout-close{position:absolute;right:16px;top:16px;width:34px;height:34px;border:0;border-radius:8px;background:var(--bg-alt);cursor:pointer;font-size:17px;}
  .checkout-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .checkout-field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
  .checkout-field.full{grid-column:1/-1;}
  .checkout-field label{font-size:13px;font-weight:600;}
  .checkout-field input,.checkout-field textarea,.checkout-field select{border:1.5px solid var(--line);border-radius:9px;padding:12px 13px;font-family:inherit;font-size:14px;background:#fcfdff;}
  .checkout-field textarea{resize:vertical;min-height:80px;}
  .checkout-field input:focus,.checkout-field textarea:focus,.checkout-field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,92,255,.14);}
  .delivery-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 18px;}
  .delivery-choice label{border:1.5px solid var(--line);border-radius:9px;padding:13px;cursor:pointer;font-size:14px;}
  .delivery-choice input{margin-right:8px;}
  .checkout-summary{background:var(--bg-alt);border-radius:10px;padding:14px;margin:4px 0 18px;font-size:14px;}
  .checkout-summary-row{display:flex;justify-content:space-between;gap:15px;margin:5px 0;}
  .checkout-submit{width:100%;border:0;background:var(--accent);color:#fff;padding:14px;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;}
  .checkout-submit:hover{background:var(--accent-ink);}
  .checkout-submit:disabled{opacity:.6;cursor:wait;}
  .checkout-small{font-size:11.5px;color:var(--ink-soft);line-height:1.45;text-align:center;margin:10px 0 0;}
  @media(max-width:650px){.checkout-form-grid{grid-template-columns:1fr}.checkout-field.full{grid-column:auto}.checkout-modal{padding:24px 18px}.delivery-choice{grid-template-columns:1fr;}}

  /* TERMINBUCHUNG */
  .field select{border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;font-family:inherit;font-size:14.5px;background:#FCFDFF;color:var(--ink);}
  .field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,92,255,0.14);}
  .booking-consent{display:flex;gap:10
